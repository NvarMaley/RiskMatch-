name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,research]'
      - run: pytest
      - run: python scripts/check_notebooks.py
      - run: python scripts/check_checklist.py
      - run: python scripts/task_dependencies.py --check
      - run: node --test tests/web/*.test.cjs
